name: Build and deploy staging (no-docker rsync)

# Temporary stand-in for deploy-stage.yml: burnett01/rsync-deployments is a
# Docker container action, and githubrunner-p1's runner user currently can't
# reach /var/run/docker.sock. This swaps that one step for a plain rsync-over-ssh
# shell step. Once Docker access is fixed on the runner, go back to
# deploy-stage.yml and delete this file.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    environment: staging

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v3
        with:
          node-version: 24.11.1

      - name: Setup PHP with composer v2.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}
          tools: composer:v2
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install missing PHP extensions.
        run: |
          php_ver=$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')
          echo "Active PHP version: $php_ver"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "php$php_ver-imagick"
        shell: bash

      - name: Get Composer Cache Directory.
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache composer packages.
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache node modules.
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Validate composer.json and composer.lock.
        run: composer validate
        shell: bash

      - name: Merge composer.local.json (pre-install).
        run: |
          if [ -f composer-local-merge.php ]; then
            php composer-local-merge.php pre-install
          else
            echo "No composer-local-merge.php found - skipping local merge"
          fi
        shell: bash

      - name: Install composer dependencies.
        run: composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader --classmap-authoritative
        shell: bash

      - name: Restore composer files after local merge (post-install).
        run: |
          if [ -f composer-local-merge.php ]; then
            php composer-local-merge.php post-install
          else
            echo "No composer-local-merge.php found - skipping restore"
          fi
        shell: bash

      - name: Write composer versions info file.
        run: composer show >> composer.versions.md
        shell: bash

      - name: Inject access token in .npmrc.
        run: |
          echo "@helsingborg-stad:registry=https://npm.pkg.github.com/helsingborg-stad" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc
        shell: bash

      - name: Get ACF
        run: |
          wget "${{ secrets.ACF_URL }}" -O acf.zip
          unzip acf.zip -d wp-content/plugins/
          rm acf.zip
        shell: bash

      - name: Execute buildscripts in themes and plugins folders.
        run: php ./build.php --cleanup --no-composer-in-child-packages --install-npm
        shell: bash

      - name: Cleanup .npmrc
        run: rm ~/.npmrc
        shell: bash

      - name: Set up deploy SSH key and pinned host key.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          install -m 700 -d /tmp/deploy-ssh
          install -m 600 /dev/null /tmp/deploy-ssh/id_deploy
          printf '%s\n' "$DEPLOY_KEY" > /tmp/deploy-ssh/id_deploy

          ssh-keyscan -t ecdsa -p ${{ vars.DEPLOY_REMOTE_PORT }} ${{ vars.DEPLOY_REMOTE_HOST }} > /tmp/deploy-ssh/known_hosts 2>/dev/null
          actual_fingerprint=$(ssh-keygen -lf /tmp/deploy-ssh/known_hosts | awk '{print $2}')
          if [ "$actual_fingerprint" != "${{ secrets.DEPLOY_FINGERPRINT }}" ]; then
            echo "::error::Host key fingerprint mismatch. Expected ${{ secrets.DEPLOY_FINGERPRINT }}, got $actual_fingerprint"
            exit 1
          fi
        shell: bash

      - name: The rsync deployment to www-data user.
        run: |
          rsync -avzrog --ignore-errors --delete --backup --backup-dir=${{ vars.DEPLOY_REMOTE_BACKUP_DIR }}/$GITHUB_SHA --exclude="/config" --exclude config-example --exclude wp-content/uploads --exclude wp-content/plugins/gravityforms --exclude wp-content/plugins/wp-schema-pro --exclude track-assets --exclude wp-content/plugins/volontar-wordpress --exclude wp-content/languages --exclude .htaccess --exclude security.txt --exclude wp-content/plugins/local_* --exclude wp-content/mu-plugins/local_* --exclude wp-content/fonts \
            -e "ssh -p ${{ vars.DEPLOY_REMOTE_PORT }} -i /tmp/deploy-ssh/id_deploy -o UserKnownHostsFile=/tmp/deploy-ssh/known_hosts -o StrictHostKeyChecking=yes" \
            . ${{ vars.DEPLOY_REMOTE_USER }}@${{ vars.DEPLOY_REMOTE_HOST }}:${{ vars.DEPLOY_REMOTE_PATH }}
        shell: bash

      - name: Clean up deploy SSH key.
        if: always()
        run: rm -rf /tmp/deploy-ssh
        shell: bash

      - name: Compress backup files.
        uses: appleboy/ssh-action@v1.1.0
        with:
          script: tar --remove-files -zcf ${{ vars.DEPLOY_REMOTE_BACKUP_DIR }}/${{ github.sha }}.tar.gz -C ${{ vars.DEPLOY_REMOTE_BACKUP_DIR }} ${{ github.sha }}
          host: ${{ vars.DEPLOY_REMOTE_HOST }}
          username: ${{ vars.DEPLOY_REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_REMOTE_PORT }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}

      - name: Delete backups older than 7 days.
        uses: appleboy/ssh-action@v1.1.0
        with:
          script: find ${{ vars.DEPLOY_REMOTE_BACKUP_DIR }} -type f -mtime +7 -name '*.tar.gz' -delete
          host: ${{ vars.DEPLOY_REMOTE_HOST }}
          username: ${{ vars.DEPLOY_REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_REMOTE_PORT }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}

      - name: Set file permissions.
        uses: appleboy/ssh-action@v1.1.0
        with:
          script: |
            find ${{ vars.DEPLOY_REMOTE_PATH }} -path ${{ vars.DEPLOY_REMOTE_PATH }} -prune -o ! -type l -exec chmod g+r {} +
            find ${{ vars.DEPLOY_REMOTE_PATH }}/wp-content/uploads -path ${{ vars.DEPLOY_REMOTE_PATH }}/wp-content/uploads -prune -o ! -type l -exec chmod g+rw {} +
          host: ${{ vars.DEPLOY_REMOTE_HOST }}
          username: ${{ vars.DEPLOY_REMOTE_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ vars.DEPLOY_REMOTE_PORT }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
